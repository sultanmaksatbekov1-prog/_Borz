<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="./style/all.css" />
    <link rel="stylesheet" href="./style/core.css" />
    <link rel="stylesheet" href="./style/style.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    
  </head>
  <body>
    <section>
      <div class="container call-me">
        <div class="form">
          <form class="contact-form" action="#" method="post">
            <label class="field">
              <span class="visually-hidden">Your Name</span>
              <input type="text" name="name" placeholder="Your Name" required />
            </label>

            <label class="field">
              <span class="visually-hidden">Email</span>
              <input type="email" name="email" placeholder="Email" required />
            </label>

            <label class="field">
              <span class="visually-hidden">Your website</span>
              <input type="url" name="website" placeholder="Your website" />
            </label>

            <label class="field">
              <span class="visually-hidden">How can I help?</span>
              <textarea
                name="message"
                placeholder="How can I help?"
                required
                rows="5"
              ></textarea>
            </label>

            <div class="form-button">
              <button class="contact-btn" type="submit">Get In Touch</button>
              <div class="form-socials">
                <a href="#" class="social-icon" aria-label="Reddit">
                  <i class="fa-brands fa-reddit-alien"></i>
                </a>
                <a href="#" class="social-icon" aria-label="Linkedin">
                  <i class="fa-brands fa-linkedin-in"></i>
                </a>
                <a href="#" class="social-icon" aria-label="Discord">
                  <i class="fa-brands fa-discord"></i>
                </a>
                <a href="#" class="social-icon" aria-label="Twitter">
                  <i class="fa-brands fa-twitter"></i>
                </a>
              </div>
            </div>
          </form>
        </div>
        <div class="contacts">
          <h2>
            Let’s talk for <br />
            Something special
          </h2>
          <p class="description">
            I seek to push the limits of creativity to create high-engaging,
            user-friendly, and memorable interactive experiences.
          </p>
          <p class="email">
            <i class="fa-solid fa-envelope"></i> email@example.com
          </p>
          <p class="phone">
            <i class="fa-solid fa-phone"></i> +1 234 56 78 910
          </p>
        </div>
      </div>
    </section>
  </body>
</html>
